<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abalone</title>
<style>
  :root {
    --bg: #0d0d0e; --card: #141416; --line: #232326; --text: #ededee; --dim: #8a8a90;
    --accent: #d9d5cc; --ease: cubic-bezier(.22, .8, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #04090d; }
  body { color: var(--text); font: 15px/1.5 -apple-system, "Inter", "Segoe UI", sans-serif; }

  .label { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }

  /* ---------- the controls: a glass panel inside the ocean ---------- */
  .top { position: absolute; z-index: 6; left: 0; right: 0; top: 0; padding: 28px clamp(16px, 4vw, 64px); display: flex; justify-content: space-between; align-items: baseline; pointer-events: none; }
  h1 { font-size: 18px; font-weight: 600; letter-spacing: .02em; }
  h1 span { color: var(--dim); font-weight: 400; }
  .status { color: var(--dim); font-size: 13px; }
  .status i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #475569; margin-right: 6px; }
  .status.ok i { background: #7fb08a; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
  svg { width: 100%; overflow: visible; }
  .panel { position: absolute; z-index: 6; left: clamp(16px, 3vw, 48px); top: 50%; transform: translateY(-46%); width: 300px; max-height: 82vh; overflow: auto;
           display: grid; gap: 16px; padding: 22px; border-radius: 16px; background: rgba(9, 20, 26, .55); border: 1px solid rgba(255,255,255,.08);
           backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(0,0,0,.3); border-radius: 10px; padding: 4px; }
  .seg button { background: none; border: 0; color: var(--dim); padding: 7px; border-radius: 9px; font: inherit; cursor: pointer; transition: .3s var(--ease); }
  .seg button.on { background: rgba(255,255,255,.1); color: var(--text); }
  .row { display: grid; gap: 6px; }
  .row div { display: flex; justify-content: space-between; font-size: 13px; }
  .row span { color: var(--dim); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; background: rgba(255,255,255,.14); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; transition: transform .2s; }
  input[type=range]:active::-webkit-slider-thumb { transform: scale(1.25); }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--accent); cursor: pointer; }
  .why { left: auto; right: clamp(16px, 3vw, 48px); width: 320px; }
  .why .note { font-size: 11.5px; line-height: 1.5; color: var(--dim); }
  .bar { display: grid; gap: 6px; }
  .bar > div:first-child { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; }
  .bar span { color: var(--text); }
  .bar output { font-size: 20px; font-weight: 300; font-variant-numeric: tabular-nums; }
  .bar small { color: var(--dim); font-size: 11.5px; }
  .bar u { text-decoration: none; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; margin-left: 8px; padding: 1px 7px; border-radius: 99px; background: rgba(255,255,255,.12); }
  .track { height: 3px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
  .track i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--accent); transition: width 1.4s var(--ease); }
  .hole { fill: #0d0d0e; fill-opacity: .75; }

  /* ---------- 2. the ocean ---------- */
  #sim { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(#0b1a23 0%, #08141b 45%, #04090d 100%); }
  #scene, #fx { position: absolute; inset: 0; width: 100%; height: 100%; }
  #stage { transform-origin: 0 60px; }
  .ray { fill: url(#rayg); animation: ray 9s ease-in-out infinite alternate; }
  @keyframes ray { from { opacity: .04; } to { opacity: .16; } }
  .kelp { fill: none; stroke: #0c2a2e; stroke-width: 7; stroke-linecap: round; transform-box: fill-box; transform-origin: 50% 100%; animation: sway 6s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: skewX(-5deg); } to { transform: skewX(5deg); } }
  .ring { fill: none; stroke: #0d0d0e; stroke-opacity: .55; stroke-width: 1.5; vector-effect: non-scaling-stroke; opacity: 0; }
  #shell { transition: filter 2.4s var(--ease); }
  #shell.done { filter: drop-shadow(0 0 28px rgba(217,213,204,.28)); }
  .ripple { fill: none; stroke: #bcd7de; stroke-width: 1.2; vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center; animation: ripple 3.2s var(--ease) forwards; }
  @keyframes ripple { from { transform: scale(.7); opacity: .5; } to { transform: scale(1.9); opacity: 0; } }
  #bloom { fill: url(#bloomg); opacity: 0; transition: opacity 2.5s var(--ease); }
  #bloom.on { opacity: 1; }

  .hud { position: absolute; z-index: 4; left: 0; right: 0; top: 14vh; text-align: center; pointer-events: none; }
  .hud .big { font-size: clamp(72px, 13vw, 180px); line-height: 1; font-weight: 200; letter-spacing: -.04em; font-variant-numeric: tabular-nums; text-shadow: 0 0 60px rgba(160,210,225,.25); }
  .hud .big small { font-size: .22em; letter-spacing: .02em; color: var(--dim); margin-left: .35em; font-weight: 300; }
  #detail { margin-top: 8px; color: var(--dim); opacity: 0; transition: opacity 1.6s var(--ease); }
  #detail.on { opacity: 1; }
  .timeline { position: absolute; z-index: 4; left: 50%; bottom: 7vh; width: min(560px, 80vw); transform: translateX(-50%); }
  .timeline .bar { height: 1px; background: #ffffff22; position: relative; }
  .timeline .bar i { position: absolute; inset: 0 auto 0 0; width: 0; will-change: width; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .timeline div:last-child { display: flex; justify-content: space-between; margin-top: 10px; color: var(--dim); font-size: 12px; letter-spacing: .1em; }

  @media (max-width: 1100px) { .why { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; } }
</style>
</head>
<body>

<!-- THE OCEAN: scene + controls -->
<section id="sim">
  <div class="top"><h1>Abalone <span>/ Group 11</span></h1><div class="status" id="status"><i></i><span>connecting</span></div></div>
  <div class="panel">
    <div class="label">Measurements</div>
    <div class="seg" id="sex"><button data-v="M">Male</button><button data-v="F" class="on">Female</button><button data-v="I">Infant</button></div>
    <div id="sliders" style="display:grid;gap:14px"></div>
  </div>
  <svg id="scene" viewBox="-400 -250 800 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <radialGradient id="nacre" cx="35%" cy="35%" r="80%"><stop offset="0" stop-color="#f1eee7"/><stop offset=".6" stop-color="#b9b4a8"/><stop offset="1" stop-color="#7d796f"/></radialGradient>
      <linearGradient id="rayg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ee" stop-opacity="1"/><stop offset="1" stop-color="#bfe3ee" stop-opacity="0"/></linearGradient>
      <radialGradient id="pool" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2d4a52" stop-opacity=".55"/><stop offset="1" stop-color="#2d4a52" stop-opacity="0"/></radialGradient>
      <radialGradient id="bloomg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d9efff" stop-opacity=".2"/><stop offset="1" stop-color="#d9efff" stop-opacity="0"/></radialGradient>
      <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14262b"/><stop offset="1" stop-color="#050a0c"/></linearGradient>
    </defs>
    <!-- light from the surface -->
    <g>
      <polygon class="ray" points="-300,-250 -240,-250 -60,250 -200,250" style="animation-delay:-1s"/>
      <polygon class="ray" points="-120,-250 -70,-250 120,250 -10,250" style="animation-delay:-4s"/>
      <polygon class="ray" points="60,-250 130,-250 330,250 190,250" style="animation-delay:-7s"/>
      <polygon class="ray" points="230,-250 270,-250 420,250 330,250" style="animation-delay:-2.5s"/>
    </g>
    <!-- seabed and kelp -->
    <path d="M-420 175 C-250 150 -120 190 0 170 C140 150 260 185 420 160 L420 260 L-420 260 Z" fill="url(#sand)"/>
    <ellipse cx="0" cy="60" rx="260" ry="190" fill="url(#pool)"/>
    <g>
      <path class="kelp" d="M-340 250 C-352 200 -326 170 -338 120" style="animation-delay:-1s"/>
      <path class="kelp" d="M-310 250 C-296 215 -318 190 -304 150" style="animation-delay:-3s"/>
      <path class="kelp" d="M330 250 C342 205 318 175 332 130" style="animation-delay:-2s"/>
      <path class="kelp" d="M360 250 C348 218 368 195 356 160" style="animation-delay:-4s"/>
    </g>
    <!-- the mermaid, a slow silhouette swimming across -->
    <g id="mermaid" opacity=".65">
      <g id="tail">
        <path fill="#0a1d24" stroke="#2f5560" stroke-opacity=".6" d="M195 62 C165 56 140 62 120 70 C105 58 95 52 82 50 C92 62 96 70 90 72 C96 76 94 84 84 94 C98 90 110 84 122 74 C142 78 168 78 195 74 Z"/>
      </g>
      <path fill="#0a1d24" stroke="#2f5560" stroke-opacity=".6" d="M246 50 C235 50 215 52 195 62 L195 74 C215 70 236 64 248 58 Z"/>
      <path fill="#0a1d24" stroke="#2f5560" stroke-opacity=".6" d="M246 52 C262 54 276 52 290 46 L292 50 C278 58 262 62 248 60 Z"/>
      <circle cx="252" cy="42" r="9" fill="#0a1d24" stroke="#2f5560" stroke-opacity=".6"/>
      <path id="hair" fill="#0a1d24" stroke="#2f5560" stroke-opacity=".6" d="M247 34 C228 20 205 30 188 50 C205 44 224 46 242 54 Z"/>
    </g>
    <!-- the abalone, drawn as it grows -->
    <g id="stage">
      <ellipse id="bloom" cx="0" cy="60" rx="330" ry="260"/>
      <g id="ripples"></g>
      <g transform="translate(0 60)"><g id="shell">
        <path id="body" fill="url(#nacre)" stroke="#0d0d0e" stroke-opacity=".5" vector-effect="non-scaling-stroke"/>
        <g id="rings"></g>
        <g class="holes" id="holes"></g>
      </g></g>
    </g>
  </svg>
  <canvas id="fx"></canvas>
  <div class="panel why" id="why">
    <div class="label">Age drivers</div>
    <div id="bars" style="display:grid;gap:11px"></div>
    <p class="note">Share of the prediction that each measurement can move, over its realistic range (1st to 99th percentile of the data). Linear regression: age = intercept + sum of coefficient × measurement.</p>
  </div>
  <div class="hud">
    <div class="label">Estimated age</div>
    <div class="big"><span id="simage">0.0</span><small>years</small></div>
    <div id="detail"></div>
  </div>
  <div class="timeline"><div class="bar"><i id="tl"></i></div><div><span>0</span><span>25 years</span></div></div>
</section>

<script>window.STATIC_DATA = {"model": {"intercept": 3.6277345308710736, "sex": {"M": 0.3194081705422905, "F": 0.21700005614864198, "I": -0.5364082266908422}, "coefficients": {"length": -1.44108499477598, "diameter": 12.474688972974452, "height": 10.422820286752685, "whole_weight": 7.865919135686763, "shucked_weight": -18.68724697397853, "viscera_weight": -8.375863099967914, "shell_weight": 9.226361597272026}, "ranges": {"length": [0.195, 0.735, 0.545], "diameter": [0.14, 0.58, 0.425], "height": [0.045, 0.22, 0.14], "whole_weight": [0.03574, 2.1445800000000017, 0.8], "shucked_weight": [0.0135, 0.9979700000000021, 0.336], "viscera_weight": [0.00787, 0.4761500000000005, 0.171], "shell_weight": [0.01037, 0.62, 0.234]}}, "metrics": [{"date": "2026-10-22T15:40:41", "rmse": 2.2161554998121615, "mae": 1.5905617539006103}]};</script>
<script>
const $ = (id) => document.getElementById(id);
// On a static host (no server) bin/build_static.py puts the model and the metrics in the page
const STATIC = window.STATIC_DATA || null;
const SVG = "http://www.w3.org/2000/svg";
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// outline of the shell, drawn in a 200 x 200 box (the notch on the left is where the holes are)
const OUTLINE = "M0 -100 C60 -100 100 -60 100 0 C100 60 55 100 0 100 C-50 100 -85 70 -90 30 C-92 10 -80 -5 -88 -25 C-95 -50 -45 -100 0 -100Z";
const HOLES = [[-76, -52], [-83, -36], [-80, -18], [-74, -1], [-76, 16]];
const ORIGIN = [-40, 0]; // growth starts here and spreads outward

$("body").setAttribute("d", OUTLINE);
for (const [x, y] of HOLES) {
  const c = document.createElementNS(SVG, "circle");
  c.setAttribute("class", "hole"); c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 3.5);
  $("holes").append(c);
}
const POOL = 32; // growth rings that can exist (the dataset goes up to 29 rings)
const ringEls = [];
for (let i = 1; i <= POOL; i++) {
  const p = document.createElementNS(SVG, "path");
  p.setAttribute("class", "ring"); p.setAttribute("d", OUTLINE);
  $("rings").append(p); ringEls.push(p);
}

/* ================= the measurements (glass panel) ================= */
const FIELDS = [
  ["length", "Length"], ["diameter", "Diameter"], ["height", "Height"], ["whole_weight", "Whole weight"],
  ["shucked_weight", "Shucked weight"], ["viscera_weight", "Viscera weight"], ["shell_weight", "Shell weight"],
];
const PARTS = ["shucked_weight", "viscera_weight", "shell_weight"];
const state = { sex: "F" };
const inputs = {};
let model = null; // coefficients of the linear regression, from /model
let official = null; // the answer of the API for the current inputs

// the model is a linear regression: rings = intercept + sex + sum(coefficient * value)
// so the scene can follow every pixel of the sliders without waiting for the API
function predictLocal() {
  let rings = model.intercept + model.sex[state.sex];
  for (const k in model.coefficients) rings += model.coefficients[k] * state[k];
  return rings;
}

function setField(key, value) {
  state[key] = value;
  inputs[key].value = value;
  inputs[key].parentElement.querySelector("output").textContent = value.toFixed(3);
}
// the 3 parts (meat, viscera, shell) can't weigh more than the whole abalone
function keepWeightsConsistent(changed) {
  const sum = PARTS.reduce((t, k) => t + state[k], 0);
  if (sum <= state.whole_weight) return;
  if (changed === "whole_weight") PARTS.forEach((k) => setField(k, (state[k] * state.whole_weight) / sum));
  else setField(changed, Math.max(model.ranges[changed][0], state.whole_weight - (sum - state[changed])));
}

// Global weight of each measurement in the formula. The raw coefficients can't be compared
// (different units), so we use: coefficient x realistic range of the measurement (1st to 99th
// percentile) = how many years this measurement can move the age at most. Then a share in %.
const WHY = { sex: "Sex", length: "Length", diameter: "Diameter", height: "Height", whole_weight: "Whole weight",
              shucked_weight: "Shucked weight", viscera_weight: "Viscera weight", shell_weight: "Shell weight" };
function buildBars() {
  const sexes = Object.values(model.sex);
  const years = { sex: Math.max(...sexes) - Math.min(...sexes) };
  for (const k in model.coefficients) years[k] = Math.abs(model.coefficients[k]) * (model.ranges[k][1] - model.ranges[k][0]);
  const total = Object.values(years).reduce((t, v) => t + v, 0);
  const order = Object.keys(WHY).sort((a, b) => years[b] - years[a]); // biggest first
  const max = (100 * years[order[0]]) / total;
  order.forEach((k, i) => {
    const share = (100 * years[k]) / total;
    const coef = k === "sex" ? "" : `coefficient ${model.coefficients[k] > 0 ? "+" : "−"}${Math.abs(model.coefficients[k]).toFixed(1)}`;
    const el = document.createElement("div");
    el.className = "bar";
    el.innerHTML = `<div><span>${WHY[k]}${i === 0 ? "<u>biggest</u>" : ""}</span><output>${share.toFixed(0)}%</output></div>
      <div class="track"><i></i></div><small>${coef}</small>`;
    $("bars").append(el);
    // the longest bar fills the track, the others are in proportion; they grow in one after the other
    setTimeout(() => (el.querySelector("i").style.width = `${(share / max) * 100}%`), 600 + i * 120);
  });
}

// what the scene must show for the current inputs; the scene moves smoothly towards it
const PX = 380; // 1 unit of measurement = the same number of pixels, no offset
function target() {
  const rings = Math.max(1, official ? official.rings : predictLocal());
  return { sx: (state.length * PX) / 200, sy: (state.diameter * PX) / 200, rings, age: rings + 1.5 };
}

let timer;
let replayTimer;
function changed() {
  official = null;
  clearTimeout(replayTimer);
  replayTimer = setTimeout(() => startIntro(false), 400); // replay the growth when the slider stops
  clearTimeout(timer);
  timer = setTimeout(async () => { // the API confirms the number (waits for the slider to stop)
    const sent = JSON.stringify(state);
    if (STATIC) return; // static page: the local formula is the answer
    try {
      const r = await fetch("/predict", { method: "POST", headers: { "Content-Type": "application/json" }, body: sent });
      if (r.ok && sent === JSON.stringify(state)) { official = await r.json(); setStatus(true); }
    } catch { setStatus(false); }
  }, 250);
}

function buildControls() {
  for (const [key, label] of FIELDS) {
    const [min, max, median] = model.ranges[key];
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<div><span>${label}</span><output></output></div>
      <input type="range" min="${min}" max="${max}" step="${(max - min) / 500}">`;
    inputs[key] = row.querySelector("input");
    $("sliders").append(row);
    setField(key, median);
    inputs[key].oninput = (e) => {
      setField(key, +e.target.value);
      if (key === "whole_weight" || PARTS.includes(key)) keepWeightsConsistent(key);
      changed();
    };
  }
  // medians of the parts can add up to more than the median of the whole: fix once at start
  keepWeightsConsistent("whole_weight");
}
$("sex").onclick = (e) => {
  if (!e.target.dataset.v) return;
  state.sex = e.target.dataset.v;
  document.querySelectorAll("#sex button").forEach((b) => b.classList.toggle("on", b === e.target));
  changed();
};
function setStatus(ok) {
  $("status").className = "status" + (ok ? " ok" : "");
  $("status").lastChild.textContent = ok ? "model live" : "API / model unavailable";
}

/* ================= the ocean ================= */
const fx = $("fx"), ctx = fx.getContext("2d");
let W = 0, H = 0, simVisible = false;
const particles = [];
function resize() {
  const r = $("sim").getBoundingClientRect();
  W = fx.width = r.width; H = fx.height = r.height;
}
addEventListener("resize", resize);
// "marine snow" drifting up, and bubbles when a growth ring appears
function addParticle(x, y, bubble) {
  particles.push({
    x, y, bubble, r: bubble ? 1.5 + Math.random() * 3 : 0.6 + Math.random() * 1.6,
    v: bubble ? 30 + Math.random() * 50 : 6 + Math.random() * 16,
    ph: Math.random() * 6.28, a: bubble ? 0.5 : 0.15 + Math.random() * 0.25,
  });
}
function spawnBubbles() {
  const b = $("shell").getBoundingClientRect(), s = $("sim").getBoundingClientRect();
  for (let i = 0; i < 4; i++) addParticle(b.left - s.left + Math.random() * b.width, b.top - s.top + b.height * 0.3, true);
}
function ripple(sx, sy) {
  const e = document.createElementNS(SVG, "ellipse");
  e.setAttribute("class", "ripple"); e.setAttribute("cx", 0); e.setAttribute("cy", 60);
  e.setAttribute("rx", 60 + sx * 40); e.setAttribute("ry", 30 + sy * 25);
  e.addEventListener("animationend", () => e.remove());
  $("ripples").append(e);
}

// cur = what is on screen. Every frame it moves a bit towards target(): that is what makes
// every change smooth (size, number of rings, age), whatever the speed of the slider
const cur = { sx: 1, sy: 1, rings: 9, age: 10.5 };
let g = 0;            // growth of the intro: 0 = just born, 1 = full size
let introStart = null, ripples = 0;
let duration = 4500;
const ease = (p) => 0.5 - 0.5 * Math.cos(Math.PI * p); // smooth start and end
const clamp01 = (x) => Math.max(0, Math.min(1, x));

let collapse = null; // the shell shrinks back to its first ring before growing again
function startIntro(first) {
  $("shell").classList.remove("done"); $("bloom").classList.remove("on"); $("detail").classList.remove("on");
  introStart = null; ripples = 0;
  if (first) { g = 0; duration = 4500; introStart = performance.now() + 700; }
  else { duration = 3250; collapse = { from: g, t0: performance.now() }; }
}

const mermaid = $("mermaid"), tail = $("tail");
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!simVisible || !model) return;
  const t = now / 1000;

  // 1. move the displayed values towards the target (exponential easing)
  const T = target(), a = 1 - Math.exp(-dt * 5);
  for (const k of ["sx", "sy", "rings", "age"]) cur[k] += (T[k] - cur[k]) * a;
  if (collapse) { // 0.6 s: shrink back to the first ring, then the growth starts again
    const p = clamp01((now - collapse.t0) / 600);
    g = collapse.from * (1 - ease(p));
    if (p >= 1) { collapse = null; g = 0; introStart = now + 200; }
  }
  if (introStart !== null) {
    g = ease(clamp01((now - introStart) / duration));
    if (g >= 1) { introStart = null; $("shell").classList.add("done"); $("bloom").classList.add("on"); $("detail").classList.add("on"); }
  }

  // 2. draw the shell: its size, its growth rings, its holes
  $("shell").setAttribute("transform", `scale(${cur.sx} ${cur.sy})`);
  $("body").setAttribute("transform", `translate(${ORIGIN[0]} 0) scale(${g}) translate(${-ORIGIN[0]} 0)`);
  const N = Math.max(1.001, cur.rings);
  ringEls.forEach((el, idx) => {
    const i = idx + 1;
    // ring i exists when i < N; during the intro it appears when the shell grows past it
    const alpha = clamp01(N - i) * clamp01((g - i / N) * 10);
    el.style.opacity = alpha;
    if (alpha > 0) el.setAttribute("transform", `translate(${ORIGIN[0]} 0) scale(${i / N}) translate(${-ORIGIN[0]} 0)`);
  });
  if (introStart !== null && g > 0 && g < 1) { // a new ring was just crossed: ripple and bubbles
    const n = Math.floor(g * N);
    while (ripples < n) { ripples++; ripple(cur.sx, cur.sy); spawnBubbles(); }
  }
  $("holes").style.opacity = clamp01((g - 0.9) * 10);

  // 3. the numbers
  const age = cur.age * g;
  $("simage").textContent = age.toFixed(1);
  $("tl").style.width = `${clamp01(age / 25) * 100}%`;
  $("detail").textContent = `${cur.rings.toFixed(1)} growth rings` + (window.METRICS_LAST ? ` · typical error ±${METRICS_LAST.mae.toFixed(1)} rings` : "");

  // 4. the mermaid crosses the scene slowly, with a gentle wave and a swaying tail
  const x = -560 + ((t * 22) % 1250), y = -190 + 30 * Math.sin(t * 0.7);
  mermaid.setAttribute("transform", `translate(${x} ${y}) rotate(${5 * Math.cos(t * 0.7)} 190 60) scale(1)`);
  tail.setAttribute("transform", `rotate(${9 * Math.sin(t * 2.4)} 195 68)`);

  // 5. marine snow and bubbles
  while (particles.filter((p) => !p.bubble).length < 70) addParticle(Math.random() * W, H + Math.random() * H * 0.2, false);
  ctx.clearRect(0, 0, W, H);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.y -= p.v * dt; p.x += Math.sin(t + p.ph) * 12 * dt;
    if (p.y < -10) { particles.splice(i, 1); continue; }
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28);
    if (p.bubble) { ctx.strokeStyle = `rgba(200,230,240,${p.a})`; ctx.stroke(); }
    else { ctx.fillStyle = `rgba(210,235,242,${p.a})`; ctx.fill(); }
  }
}

// the birth-to-adult growth plays once, when the page opens
simVisible = true;
startIntro(true);

// only the typical error is needed (shown under the age)
async function loadMetrics() {
  const m = STATIC ? STATIC.metrics : await (await fetch("/metrics")).json();
  if (m.length) window.METRICS_LAST = m[m.length - 1];
}

/* ================= start ================= */
(async () => {
  resize(); requestAnimationFrame(loop);
  try {
    model = STATIC ? STATIC.model : await (await fetch("/model")).json();
    if (!model.intercept && model.intercept !== 0) throw new Error("no model");
    buildControls(); buildBars(); Object.assign(cur, target()); changed(); setStatus(true);
  } catch { setStatus(false); }
  loadMetrics();
})();
</script>
</body>
