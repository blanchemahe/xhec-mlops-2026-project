[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xhec-mlops-project-student"
version = "0.0.1"
authors = [
  { name = "Lancelot Brisset" , email = "brissetlancelot92@gmail.com" } ,
  { name = "Louan Bardou" , email = "louan.bardou@hec.edu" },
  { name = "Blanche Mahé" , email = "blanche.mahe@hec.edu" },
  { name = "Alix Bernal" , email = "alix.bernal@hec.edu" }
]
description = "X-HEC MLOps Project on Abalone age prediction model"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.159.1",
    "pandas>=2.3.3",
    "prefect>=3.8.8",
    "pydantic>=2.14.1",
    "scikit-learn>=1.7.2",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "nbstripout>=0.9.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "seaborn>=0.13.2",
]

[tool.ruff]
line-length = 130

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["D", "ANN", "E", "W", "F", "N", "Q", "ARG", "PTH", "I"]
ignore = ["D417", "D100", "N806", "N815", "N803", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
order-by-type = true

[tool.pytest.ini_options]
pythonpath = ["."]
